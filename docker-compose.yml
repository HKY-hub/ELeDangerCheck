# 电力风险智能交底系统 - Docker Compose 部署配置
# 一键启动：MySQL数据库 + Spring Boot应用
# 使用方法：
#   1. 复制 .env.example 为 .env，按需修改配置
#   2. 执行 docker compose up -d
#   3. 访问 http://localhost:8081

version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: eledangercheck-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eledangercheck}
      MYSQL_CHARSET: utf8mb4
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/schema-mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=1000
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Spring Boot应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eledangercheck-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-eledangercheck}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - FASTCHAT_API_KEY=${FASTCHAT_API_KEY:-}
      - FASTCHAT_BASE_URL=${FASTCHAT_BASE_URL:-https://api.fastchat.cn}
      - TENCENT_TIIA_ENABLED=${TENCENT_TIIA_ENABLED:-false}
      - TENCENT_TIIA_SECRET_ID=${TENCENT_TIIA_SECRET_ID:-}
      - TENCENT_TIIA_SECRET_KEY=${TENCENT_TIIA_SECRET_KEY:-}
      - TENCENT_TIIA_REGION=${TENCENT_TIIA_REGION:-ap-guangzhou}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - TZ=Asia/Shanghai
    ports:
      - "${APP_PORT:-8081}:8081"
    volumes:
      - app-documents:/app/documents
      - app-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mysql-data:
    driver: local
  app-documents:
    driver: local
  app-uploads:
    driver: local
