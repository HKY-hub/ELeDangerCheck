server:
  port: 8081
  address: 0.0.0.0

spring:
  application:
    name: ELeDangerCheck
  profiles:
    active: mysql
  config:
    import: optional:file:./secrets-local.yml

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
    banner: false
  mapper-locations: classpath:mapper/*.xml

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

tencent:
  tiia:
    secret-id: ${TENCENT_TIIA_SECRET_ID:}
    secret-key: ${TENCENT_TIIA_SECRET_KEY:}
    region: ap-guangzhou
    enabled: true

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com/v1

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:eledangercheck;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never

---
spring:
  config:
    activate:
      on-profile: mysql